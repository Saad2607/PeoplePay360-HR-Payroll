<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Enterprise Corporate Brand Gradients -->
    <linearGradient id="p360-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="p360-orbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem / Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Base Rounded Squircle with Shadow -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#p360-primary)" filter="url(#shadow)" />

    <!-- 360 Dynamic Orbit Ring -->
    <circle cx="50" cy="50" r="32" fill="none" stroke="url(#p360-orbit)" stroke-width="4.5" stroke-dasharray="160 40" stroke-linecap="round" transform="rotate(-40 50 50)" />

    <!-- Stylized Modern 'P' Monogram -->
    <!-- Vertical Stem -->
    <rect x="36" y="28" width="8" height="44" rx="4" fill="#ffffff" />
    
    <!-- Curved P Bowl looping with 360 dynamics -->
    <path d="M 40 28 L 56 28 C 66 28 72 34 72 44 C 72 54 66 60 56 60 L 40 60" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Accent 360 Orbital Node Sparkle -->
    <circle cx="76" cy="30" r="4.5" fill="#38bdf8" />
    <circle cx="24" cy="70" r="3.5" fill="#818cf8" opacity="0.9" />
  </g>

  <!-- Typography: PeoplePay360 -->
  <g transform="translate(130, 20)">
    <!-- Wordmark -->
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
      <tspan fill="#0f172a">People</tspan>
      <tspan fill="#2563eb">Pay</tspan>
      <tspan fill="#4f46e5">360</tspan>
    </text>

    <!-- Subtitle Pill / Badge -->
    <rect x="0" y="66" width="148" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="10" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#1d4ed8" letter-spacing="1.8">
      HR &amp; PAYROLL
    </text>
  </g>
</svg>
